{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Edit Course - EXAMIQ+{% endblock %}

{% block content %}
{% include "components/page_header.html" with title="Edit course" subtitle="Update the course details below." %}

<section class="bento-card bento-card-inner max-w-2xl">
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex flex-col sm:flex-row gap-3 mt-4">
            <button type="submit" class="btn-primary btn-primary-sm">Save changes</button>
            <a href="{% url 'analytics_chairperson:subjects' %}" class="btn-secondary btn-primary-sm text-center">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Deactivate Question{% endblock %}

{% block content %}
<div class="bento-card p-6 max-w-lg">
    <h1 class="text-xl font-bold text-examiq-navy mb-2">Deactivate this question?</h1>
    <p class="text-examiq-slate mb-4">{{ object.stem|truncatechars:120 }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-primary bg-examiq-mistake hover:bg-red-600">Deactivate</button>
        <a href="{% url 'analytics_chairperson:question_list' program.pk %}" class="ml-3 text-link">Cancel</a>
    </form>
</div>
{% endblock %}

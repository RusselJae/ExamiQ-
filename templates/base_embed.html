{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EXAMIQ+{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        examiq: {
                            green: "#1A5632",
                            navy: "#0F172A",
                            slate: "#64748B",
                            cream: "#FAF9F5",
                            accent: "#C9A227",
                        },
                    },
                    fontFamily: {
                        sans: ['"Nunito Sans"', "system-ui", "sans-serif"],
                        serif: ['"Fraunces"', "Georgia", "serif"],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="embed-body bg-examiq-cream font-sans text-examiq-navy">
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>

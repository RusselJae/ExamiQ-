{% extends "reviews/focus_base.html" %}
{% load static %}

{% block title %}Review Session - EXAMIQ+{% endblock %}

{% block focus_center %}
<div id="question-container"
     class="w-full"
     data-intro-pending="false"
     data-session-id="{{ session.pk }}"
     data-question-url="{% url 'reviews:question_partial' session.pk %}">
    <div class="focus-card p-12 text-center session-waiting-placeholder">
        <div class="inline-block w-8 h-8 border-2 border-examiq-green border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-examiq-slate text-sm">Loading first question…</p>
    </div>
</div>
{% endblock %}

{% block focus_extra_js %}
<script src="{% static 'js/question-timer.js' %}"></script>
<script src="{% static 'js/session-answer-review.js' %}"></script>
{% if is_timed_exam %}
<script src="{% static 'js/exam-auto-advance.js' %}"></script>
{% endif %}
{% endblock %}

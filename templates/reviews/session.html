{% extends "reviews/focus_base.html" %}
{% load static %}

{% block title %}Review Session - EXAMIQ+{% endblock %}

{% block focus_center %}
<div id="question-container"
     class="w-full"
     hx-get="{% url 'reviews:question_partial' session.pk %}"
     hx-trigger="load"
     hx-swap="innerHTML">
    <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm p-12 text-center">
        <div class="inline-block w-8 h-8 border-2 border-examiq-cyan border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-examiq-slate text-sm">Loading question...</p>
    </div>
</div>
{% endblock %}

{% block focus_extra_js %}
<script src="{% static 'js/question-timer.js' %}"></script>
{% endblock %}

<div id="ai-tutor-modal" class="ai-tutor-modal chat-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ai-tutor-title">
    <div class="ai-tutor-modal__backdrop" data-dismiss-ai-tutor></div>
    <div class="ai-tutor-modal__panel chat-modal__panel">
        <div class="ai-tutor-modal__header">
            <h2 id="ai-tutor-title" class="ai-tutor-modal__title">ExamiQ+ AI Tutor</h2>
            <button type="button" class="ai-tutor-modal__close" data-dismiss-ai-tutor aria-label="Close">&times;</button>
        </div>

        <div class="ai-tutor-modal__subheader ai-tutor-modal__subheader--select">
            <span class="ai-tutor-modal__review-count" id="ai-tutor-review-count">Reviewing items…</span>
            <label for="ai-tutor-question-select" class="sr-only">Question</label>
            <select id="ai-tutor-question-select" class="ai-tutor-question-select"></select>
        </div>

        <div class="ai-tutor-modal__body chat-modal__body">
            <div id="ai-tutor-loading" class="ai-tutor-modal__loading">
                <div class="feedback-modal__spinner" aria-hidden="true"></div>
                <p class="text-sm text-examiq-slate">Loading your exam feedback…</p>
            </div>

            <div id="ai-tutor-content" class="ai-tutor-modal__content hidden chat-modal__content">
                <div class="ai-tutor-unified-scroll" id="ai-tutor-unified-scroll">
                    <div class="ai-tutor-feedback-panel" id="ai-tutor-feedback-panel">
                        <p class="ai-tutor-feedback-panel__meta" id="ai-tutor-meta"></p>
                        <h3 class="ai-tutor-feedback-panel__stem" id="ai-tutor-stem"></h3>

                        <div class="ai-tutor-correct-banner" id="ai-tutor-correct-banner" hidden>
                            <span class="ai-tutor-correct-banner__icon" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.15"/>
                                    <path d="M7.5 12.5l3 3 6-7" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <p class="ai-tutor-correct-banner__text">
                                <span class="ai-tutor-correct-banner__label">Correct</span>
                                <span class="ai-tutor-correct-banner__value examiq-math-block" id="ai-tutor-correct-banner-value"></span>
                            </p>
                        </div>

                        <div class="ai-tutor-unanswered-note" id="ai-tutor-unanswered-note" hidden role="note">
                            You did not select an answer for this question.
                        </div>

                        <div class="ai-tutor-answer-compare" id="ai-tutor-answer-compare">
                            <div class="ai-tutor-answer-compare__col ai-tutor-answer-compare__col--wrong">
                                <p class="ai-tutor-answer-compare__line" id="ai-tutor-user-answer-line">
                                    <span class="ai-tutor-answer-compare__prefix">You chose</span>
                                    <span class="ai-tutor-answer-compare__mark ai-tutor-answer-compare__mark--wrong" aria-hidden="true">✖</span>
                                    <span class="ai-tutor-answer-compare__value examiq-math-block" id="ai-tutor-user-answer"></span>
                                </p>
                            </div>
                            <div class="ai-tutor-answer-compare__col ai-tutor-answer-compare__col--right">
                                <p class="ai-tutor-answer-compare__line" id="ai-tutor-correct-answer-line">
                                    <span class="ai-tutor-answer-compare__prefix">Correct answer</span>
                                    <span class="ai-tutor-answer-compare__mark ai-tutor-answer-compare__mark--right" aria-hidden="true">✓</span>
                                    <span class="ai-tutor-answer-compare__value examiq-math-block" id="ai-tutor-correct-answer"></span>
                                </p>
                            </div>
                        </div>

                        <div id="ai-tutor-structured-feedback" class="ai-tutor-structured" hidden></div>
                        <div id="ai-tutor-worked-example" class="ai-tutor-worked-example" hidden></div>
                        <div id="ai-tutor-solution-visual" class="tutor-visual-host" hidden></div>
                        <div class="ai-tutor-actions-row" id="ai-tutor-actions-row" hidden>
                            <div id="ai-tutor-follow-ups" class="ai-tutor-follow-ups"></div>
                            <button type="button" class="btn-primary ai-tutor-next-btn" id="ai-tutor-next-question" hidden>
                                Next question →
                            </button>
                        </div>
                    </div>

                    <div class="chat-thread chat-thread--ai" id="ai-tutor-messages" role="log" aria-live="polite"></div>
                </div>

                <div class="chat-composer-wrap" id="ai-tutor-chat">
                    <form class="chat-composer" id="ai-tutor-chat-form" enctype="multipart/form-data">
                        <label id="ai-tutor-image-label" class="chat-composer__attach" for="ai-tutor-chat-image" title="Attach image (max 5 MB)">
                            <input type="file"
                                   id="ai-tutor-chat-image"
                                   accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
                                   class="sr-only">
                            <span aria-hidden="true">+</span>
                            <span class="sr-only">Attach photo</span>
                        </label>
                        <textarea id="ai-tutor-chat-input"
                                  class="chat-composer__input"
                                  rows="1"
                                  placeholder="Ask a follow-up about this question"
                                  maxlength="2000"></textarea>
                        <button type="submit" class="chat-composer__send" id="ai-tutor-send-btn" aria-label="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 19V5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
                                <path d="M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </form>
                    <p id="ai-tutor-image-name" class="chat-composer__file-name hidden"></p>
                    <p class="ai-feedback-disclaimer ai-tutor-modal__disclaimer" role="note">
                        AI-generated feedback can contain errors. Check your course materials when unsure.
                    </p>
                </div>
            </div>

            <div id="ai-tutor-error" class="ai-tutor-modal__error hidden" role="alert"></div>
        </div>
    </div>
</div>

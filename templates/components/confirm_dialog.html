<div id="confirm-dialog-root" class="confirm-dialog-root hidden" aria-hidden="true">

    <div class="confirm-dialog-overlay" data-confirm-cancel></div>

    <div class="confirm-dialog-card toast-item toast-item--warning" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-message">

        <p id="confirm-dialog-message" class="confirm-dialog-message"></p>

        <div class="confirm-dialog-actions">

            <button type="button" class="btn-secondary btn-primary-sm" data-confirm-cancel>Cancel</button>

            <button type="button" class="btn-primary btn-primary-sm" data-confirm-ok>Confirm</button>

        </div>

    </div>

</div>

<div id="confirm-dialog-root" class="confirm-dialog-root hidden" aria-hidden="true">
    <div class="confirm-dialog-overlay" data-confirm-cancel></div>
    <div class="confirm-dialog-card" role="alertdialog" aria-modal="true"
         aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
        <div class="confirm-dialog-head">
            <h2 id="confirm-dialog-title" class="confirm-dialog-title">Confirm</h2>
            <button type="button" class="confirm-dialog-close" data-confirm-cancel aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="confirm-dialog-body">
            <div class="confirm-dialog-icon" id="confirm-dialog-icon" aria-hidden="true"></div>
            <p id="confirm-dialog-message" class="confirm-dialog-message"></p>
        </div>
        <div class="confirm-dialog-actions">
            <button type="button" class="btn-outline btn-primary-sm" data-confirm-cancel-btn data-confirm-cancel>Cancel</button>
            <button type="button" class="btn-primary btn-primary-sm" data-confirm-ok>Confirm</button>
        </div>
    </div>
</div>

<label class="auth-field" for="{{ field.id_for_label }}">
    <span class="auth-field__label">{{ field.label }}</span>
    <div class="auth-password-wrap" data-password-field>
        <input
            type="password"
            name="{{ field.html_name }}"
            id="{{ field.id_for_label }}"
            value="{{ field.value|default:'' }}"
            class="auth-field__input auth-field__input--password"
            {% if field.field.required %}required{% endif %}
            {% if field.field.widget.attrs.autocomplete %}autocomplete="{{ field.field.widget.attrs.autocomplete }}"{% endif %}
            {% if strength_target %}data-password-strength-input{% endif %}
        >
        <button
            type="button"
            class="auth-password-toggle"
            data-password-toggle
            aria-label="Show password"
            aria-pressed="false"
        >
            <svg class="auth-password-toggle__icon auth-password-toggle__icon--show" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg class="auth-password-toggle__icon auth-password-toggle__icon--hide hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
        </button>
    </div>
    {% if field.errors %}
    <p class="auth-field__error">{{ field.errors.0 }}</p>
    {% endif %}
</label>

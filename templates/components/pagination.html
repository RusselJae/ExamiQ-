{% if page_obj.has_other_pages %}
<div class="pagination-bar">
    {% if page_obj.has_previous %}
    <a href="?{% querystring page=page_obj.previous_page_number %}" class="btn-secondary btn-primary-sm">Previous</a>
    {% endif %}
    <span class="pagination-bar__info">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?{% querystring page=page_obj.next_page_number %}" class="btn-secondary btn-primary-sm">Next</a>
    {% endif %}
</div>
{% endif %}

<div class="auth-password-strength" data-password-strength aria-live="polite">
    <p class="auth-password-strength__title">Password strength</p>
    <ul class="auth-password-strength__list">
        <li class="auth-password-strength__item" data-rule="length">
            <span class="auth-password-strength__marker" aria-hidden="true"></span>
            At least 8 characters
        </li>
        <li class="auth-password-strength__item" data-rule="not-numeric">
            <span class="auth-password-strength__marker" aria-hidden="true"></span>
            Not entirely numeric
        </li>
        <li class="auth-password-strength__item" data-rule="mixed">
            <span class="auth-password-strength__marker" aria-hidden="true"></span>
            Mix of letters and numbers
        </li>
        <li class="auth-password-strength__item" data-rule="special">
            <span class="auth-password-strength__marker" aria-hidden="true"></span>
            Includes uppercase or symbol
        </li>
    </ul>
</div>

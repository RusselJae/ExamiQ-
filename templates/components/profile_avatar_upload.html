{% load static %}
<div class="profile-avatar-wrap profile-avatar-wrap--{{ size|default:'form' }}">
    {% if user.profile_photo %}
    <img src="{{ user.profile_photo.url }}"
         alt=""
         class="profile-avatar-image"
         id="{% if preview_id %}{{ preview_id }}{% else %}profile-photo-preview{% endif %}">
    {% else %}
    <span class="profile-avatar profile-avatar--{{ user.role }} profile-avatar-image"
          id="{% if preview_id %}{{ preview_id }}{% else %}profile-photo-preview-fallback{% endif %}"
          aria-hidden="true">{{ user.initials }}</span>
    {% endif %}
    {% if show_camera %}
    <label for="id_profile_photo" class="profile-avatar-camera" title="Upload photo" aria-label="Upload profile photo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
    </label>
    {% endif %}
</div>

{% if user.is_authenticated %}
<header class="app-topbar">
    <div class="app-topbar-inner">
        <button type="button" id="sidebar-toggle-mobile" class="sidebar-mobile-toggle lg:hidden" aria-label="Open menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <div class="flex-1"></div>

        <div class="profile-dropdown" data-dropdown>
            <button type="button" class="profile-dropdown-trigger" data-dropdown-toggle aria-expanded="false" aria-haspopup="true">
                <span class="profile-avatar" aria-hidden="true">{{ user.initials }}</span>
                <span class="profile-name hidden sm:inline">{{ user.get_full_name|default:user.email }}</span>
                <svg class="profile-chevron w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
            <div class="profile-dropdown-menu hidden" data-dropdown-menu role="menu">
                <div class="profile-dropdown-header">
                    <span class="profile-avatar profile-avatar-lg">{{ user.initials }}</span>
                    <div>
                        <p class="font-semibold text-examiq-navy">{{ user.get_full_name|default:user.email }}</p>
                        <p class="text-xs text-examiq-slate">{{ user.email }}</p>
                        <p class="text-xs text-examiq-slate mt-0.5">{{ user.get_role_display }}</p>
                    </div>
                </div>
                <div class="profile-dropdown-divider"></div>
                <a href="{% url 'users:profile' %}" class="profile-dropdown-item" role="menuitem">
                    Profile
                </a>
                <div class="profile-dropdown-divider"></div>
                <a href="{% url 'account_logout' %}" class="profile-dropdown-logout" role="menuitem">Sign out</a>
            </div>
        </div>
    </div>
</header>
{% endif %}

{% extends "base.html" %}

{% block title %}Deactivate Window - {{ course.code }}{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-examiq-navy">Deactivate review window?</h1>
    <p class="text-examiq-slate mt-2">{{ object.title }}</p>
</div>
<form method="post" class="bento-card p-6 max-w-lg">
    {% csrf_token %}
    <button type="submit" class="btn-primary bg-examiq-mistake hover:bg-red-600">Deactivate</button>
    <a href="{% url 'analytics_professor:window_list' course.pk %}" class="ml-3 text-link">Cancel</a>
</form>
{% endblock %}

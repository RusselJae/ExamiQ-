<section class="concept-try-it" id="concept-try-it" data-hint="{{ try_it.hint|default:''|escape }}">
    <p class="concept-eyebrow">Try it &middot; just the first step</p>
    {% if try_it.problem %}
    <h2 class="concept-question">{{ try_it.problem }}</h2>
    {% endif %}

    <fieldset class="concept-options" id="try-it-options">
        <legend class="sr-only">First step choices</legend>
        {% for choice in try_it.first_step_choices %}
        <label class="concept-option">
            <input type="radio" name="try_it_choice" value="{{ forloop.counter0 }}" class="sr-only">
            <span class="concept-option__badge" aria-hidden="true">{% if forloop.counter0 == 0 %}A{% elif forloop.counter0 == 1 %}B{% elif forloop.counter0 == 2 %}C{% elif forloop.counter0 == 3 %}D{% else %}{{ forloop.counter }}{% endif %}</span>
            <span>{{ choice }}</span>
        </label>
        {% endfor %}
    </fieldset>

    <p class="concept-reminder hidden" id="try-it-reminder">
        <strong>Reminder:</strong> {{ try_it.reminder|default:"work through the first move only — the rest comes in Practice." }}
    </p>

    <div class="concept-panel concept-panel--warn hidden" id="try-it-feedback" role="status"></div>
    <p class="concept-hint hidden" id="try-it-hint-text"></p>

    <a class="btn-primary review-overlay__cta hidden" id="try-it-continue"
       href="{% url 'analytics_student:concept_review' review.pk %}?step=practice">
        Continue to Practice
    </a>
</section>
